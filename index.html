<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中秋主視覺 Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:#0a1420;
    font-family:'Noto Sans TC', sans-serif;
    color:#fff;
  }

  /* ===== 頂部主視覺 Hero 區塊：背景圖 + 河燈飄浮都限制在這個範圍內 ===== */
  .hero-banner{
    position:relative;
    width:100%;
    aspect-ratio:1024/1536;
    max-height:78vh;
    overflow:hidden;
    background:url('bg.png') center top / cover no-repeat, #0a1420;
  }
  .lantern-field{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:1; }

  .page-inner{ position:relative; z-index:2; max-width:420px; margin:0 auto; padding:24px 16px 60px; }

  .demo-note{
    text-align:center; font-size:12px; color:rgba(255,255,255,0.6);
    background:rgba(0,0,0,0.4); padding:8px; border-radius:8px; margin-bottom:20px;
  }
  .lantern{
    position:absolute;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    animation:lanternDrift linear infinite;
    opacity:0;
  }
  .lantern img{
    width:38px; height:38px; object-fit:contain;
    filter:drop-shadow(0 0 10px rgba(255,190,100,0.7));
  }
  .lantern-name{
    background:rgba(20,10,5,0.55);
    color:#ffe3b8;
    font-size:10.5px; font-weight:700;
    padding:2px 9px; border-radius:12px;
    white-space:nowrap;
  }
  @keyframes lanternDrift{
    0%{ transform:translate(0,0); opacity:0; }
    8%{ opacity:1; }
    92%{ opacity:1; }
    100%{ transform:translate(var(--dx, 200px), var(--dy, 140px)); opacity:0; }
  }

  /* ===== 月餅祈願卡片 ===== */
  .mooncake-card{
    position:relative; z-index:2;
    background:rgba(10,15,20,0.55);
    border:2px solid rgba(255,200,120,0.5);
    border-radius:18px;
    padding:30px 24px;
    text-align:center;
    backdrop-filter:blur(2px);
    margin-top:40px;
  }
  .mooncake-title{ font-size:15px; font-weight:900; color:#ffd98c; margin:0 0 20px; }
  .mooncake-stage{ position:relative; width:180px; height:170px; margin:0 auto 18px; cursor:pointer; }
  .mooncake-img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  .mooncake-img.split{ opacity:0; transform:scale(0.92); }
  .mooncake-stage.cracked .mooncake-img.whole{ opacity:0; transform:scale(1.08); }
  .mooncake-stage.cracked .mooncake-img.split{ opacity:1; transform:scale(1); }
  .mooncake-hint{ font-size:12.5px; color:rgba(255,255,255,0.7); margin:0 0 14px; }
  .fortune-result{
    opacity:0; transform:translateY(8px); transition:opacity 0.6s ease, transform 0.6s ease;
    font-size:14px; line-height:1.8; color:#fff2d8;
  }
  .fortune-result.show{ opacity:1; transform:translateY(0); }
</style>
</head>
<body>

<div class="hero-banner">
  <div class="lantern-field" id="field"></div>
</div>

<div class="page-inner">
  <div class="demo-note">主視覺合併 Demo：背景圖改為頂部固定Hero區塊 + 河燈飄浮限制其中 + 月餅祈願互動（點月餅試試看）</div>

  <div class="mooncake-card">
    <p class="mooncake-title">🌕 月餅祈願 🌕</p>
    <div class="mooncake-stage" id="stage">
      <img class="mooncake-img whole" src="mooncake_whole.png" alt="">
      <img class="mooncake-img split" src="mooncake_split.png" alt="">
    </div>
    <p class="mooncake-hint" id="hint">點一下月餅，看看裡面藏著什麼祝福</p>
    <div class="fortune-result" id="fortuneResult">
      團圓不在遠近，而在心裡有沒有留一個位置給彼此。<br>這個中秋，願你想見的人都在身邊。
    </div>
  </div>
</div>

<script>
const names = ['@stellajs','@nitavsvs','@dorisvsvs','@小美','@memm88','@月亮','@團圓','@回家吃飯','@想念阿嬤','@平安順遂','@widthdr','@linglingx','@好運旺旺來','@許願中','@闔家歡樂'];
const field = document.getElementById('field');
names.forEach(name => {
  const el = document.createElement('div');
  el.className = 'lantern';
  const startTop = 50 + Math.random() * 22; // 對齊真圖：約50%~72%高度之間開始飄
  const startLeft = Math.random() * 78;
  const delay = Math.random() * 16;
  const duration = 15 + Math.random() * 9;
  const dx = 140 + Math.random() * 150;
  const dy = 90 + Math.random() * 80;
  el.style.top = startTop + '%';
  el.style.left = startLeft + '%';
  el.style.animationDelay = delay + 's';
  el.style.animationDuration = duration + 's';
  el.style.setProperty('--dx', dx + 'px');
  el.style.setProperty('--dy', dy + 'px');
  el.innerHTML = `<img src="lantern.png" alt=""><span class="lantern-name">${name}</span>`;
  field.appendChild(el);
});

const stage = document.getElementById('stage');
const hint = document.getElementById('hint');
const fortuneResult = document.getElementById('fortuneResult');
stage.addEventListener('click', () => {
  if (stage.classList.contains('cracked')) return;
  stage.classList.add('cracked');
  hint.style.opacity = '0';
  setTimeout(() => { fortuneResult.classList.add('show'); }, 500);
});
</script>

</body>
</html>
